<!-- Lista tipo "11 tools for X". SPEC: {eyebrow?, title, subtitle?, cols?: 2|3, items: [{name, desc, tag?, icon? (logo:/si:/fav:/fluent:)}]} -->
<style>
.grid{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;align-content:center}
.it{display:flex;gap:18px;align-items:flex-start;background:var(--ink2);border:1px solid #262c45;border-radius:18px;padding:20px 22px}
.n{flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font:800 26px var(--display);color:#fff}
.it b{display:block;font:700 28px/1.15 var(--display);color:#fff}
.it span{display:block;font:400 21px/1.3 var(--body);color:#aab1c7;margin-top:6px}
.tag{display:inline-block;margin-top:10px;font:500 16px var(--mono);color:#1fbf75;border:1px solid #1fbf7566;border-radius:999px;padding:3px 10px}
.one .grid{grid-template-columns:1fr}
.c3 .grid{grid-template-columns:1fr 1fr 1fr}
.ic{flex:none;width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center}
.ic img{width:42px;height:42px;object-fit:contain}
</style>
<div id="canvas" class="dark"><div class="eyebrow" id="eb"></div><h1 id="t" style="margin-top:14px"></h1><p class="sub" id="s"></p><div class="grid" id="g"></div><div id="f"></div></div>
<script>
(function(){
  document.getElementById('eb').textContent=SPEC.eyebrow||'';
  document.getElementById('t').textContent=SPEC.title||'';
  document.getElementById('s').textContent=SPEC.subtitle||'';
  var items=SPEC.items||[];
  if(SPEC.cols===3)document.getElementById('canvas').classList.add('c3');else if(items.length<=5)document.getElementById('canvas').classList.add('one');
  document.getElementById('g').innerHTML=items.map(function(x,i){return '<div class="it">'+(x.icon?'<div class="ic">'+iconHTML(x.icon)+'</div>':'<div class="n">'+(i+1)+'</div>')+'<div><b>'+esc(x.name)+'</b><span>'+esc(x.desc)+'</span>'+(x.tag?'<i class="tag">'+esc(x.tag)+'</i>':'')+'</div></div>'}).join('');
  document.getElementById('f').outerHTML=footer(true);
  done();
})();
</script>
