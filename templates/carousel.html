<!-- Carrusel de LinkedIn (PDF, una página por slide). Renderizar con salida .pdf (o capturas por slide).
SPEC: {slides: [...]}. Tipos de slide:
  cover: {kind:"cover", eyebrow?, title, icons?: ["fluent:Nombre", ...]}        portada con rejilla de iconos 3D
  tool:  {kind:"tool", eyebrow?, title?, tools: [{name, icon, does, replaces?: [...], cmd?}], source?: {name, label?, note?, icon?}}  1–2 herramientas por slide; source = franja verde con el proveedor que usa Kevin (p. ej. EODHD)
  point: {kind:"point", eyebrow?, title, body?}                                 texto (evitar: poco visual)
  code:  {kind:"code", eyebrow?, title, body?, code}
  cta:   {kind:"cta", eyebrow?, title, body?, icon?} -->
<style>
@page{margin:0}
html,body{height:auto}
.slide{width:100vw;height:100vh;page-break-after:always;break-after:page;display:flex;flex-direction:column;padding:84px 72px 60px;background:radial-gradient(900px 700px at 100% 0%,#2f55ff30,transparent 60%),var(--ink);color:#fff;position:relative;overflow:hidden}
.slide .num{position:absolute;top:60px;right:72px;font:600 24px var(--mono);color:#7d849a}
.slide h1{font:800 92px/1 var(--display);letter-spacing:-.035em;margin-top:22px;text-wrap:balance}
.slide h2{font:800 66px/1.04 var(--display);letter-spacing:-.03em;margin-top:18px;text-wrap:balance}
.slide p.b{font:400 40px/1.4 var(--body);color:#c9cee0;margin-top:26px;text-wrap:pretty}
.slide pre{margin-top:30px;background:#1a1b26;border-radius:20px;padding:28px;font:400 28px/1.5 var(--mono);color:#c0caf5;white-space:pre-wrap}
.slide .footer{position:absolute;left:72px;right:72px;bottom:52px}
/* portada */
.cover{justify-content:center}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:56px;max-width:760px}
.igrid div{aspect-ratio:1;border-radius:28px;background:#ffffff0d;border:1px solid #ffffff1a;display:grid;place-items:center}
.igrid img{width:72%;height:72%;object-fit:contain}
.swipe{margin-top:48px;align-self:flex-start;font:700 30px var(--display);color:#0f1220;background:#5ee0a0;border-radius:999px;padding:16px 30px}
/* herramientas */
.tools{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;margin-top:20px;margin-bottom:120px;min-height:0}
.src{display:flex;align-items:center;gap:22px;background:#5ee0a01a;border:2px solid #5ee0a0;border-radius:28px;padding:22px 28px}
.src .ic{flex:none;width:84px;height:84px;border-radius:20px;background:#ffffff14;display:grid;place-items:center}
.src .ic img{width:80%;height:80%;object-fit:contain}
.src small{display:block;font:600 21px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#5ee0a0}
.src b{display:block;font:800 40px/1.1 var(--display);margin-top:6px}
.src span{display:block;font:400 26px/1.3 var(--body);color:#c9cee0;margin-top:4px}
.tcard{display:grid;grid-template-columns:150px 1fr;gap:30px;align-items:center;background:#f6f7fb;color:#151a2b;border-radius:34px;padding:34px 36px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.tcard .ic{width:150px;height:150px;border-radius:32px;background:#e9ecf6;display:grid;place-items:center}
.tcard .ic img{width:80%;height:80%;object-fit:contain}
.tcard h3{font:800 62px/1 var(--display);letter-spacing:-.025em}
.tcard .does{font:500 31px/1.3 var(--body);color:#3a4160;margin-top:12px}
.rep{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.rep em{font:600 20px var(--body);font-style:normal;color:#8a90a6;margin-right:4px}
.rep s{font:600 22px var(--mono);color:#c0392b;background:#fde7e7;border-radius:999px;padding:5px 14px;text-decoration-thickness:2px}
.cmd{margin-top:18px;font:600 25px var(--mono);color:#e8eaf2;background:#0f1220;border-radius:14px;padding:14px 18px;display:inline-block}
.cmd:before{content:"$ ";color:#5ee0a0}
.one .tcard{grid-template-columns:200px 1fr;padding:44px}
.one .tcard .ic{width:200px;height:200px}
.one .tcard h3{font-size:76px}
/* cierre */
.cta{background:radial-gradient(900px 700px at 0% 100%,#5ee0a055,transparent 60%),#2f55ff!important;justify-content:center}
.cta .eyebrow{color:#dfe6ff}
.cta .footer,.cta .footer div{color:#e6ebff}
.cta .footer .av{background:#0f1220}
.cta .big{width:220px;height:220px;margin-bottom:30px}
.cta .big img{width:100%;height:100%;object-fit:contain}
.cta p.b{color:#eef1ff}
</style>
<div id="canvas" style="padding:0;height:auto;display:block"></div>
<script>
(function(){
  var S=SPEC.slides||[], n=S.length;
  function tool(t){
    return '<div class="tcard"><div class="ic">'+iconHTML(t.icon||'')+'</div><div><h3>'+esc(t.name)+'</h3>'+
      (t.does?'<div class="does">'+esc(t.does)+'</div>':'')+
      (t.replaces&&t.replaces.length?'<div class="rep"><em>Replaces</em>'+t.replaces.map(function(r){return '<s>'+esc(r)+'</s>'}).join('')+'</div>':'')+
      (t.cmd?'<div class="cmd">'+esc(t.cmd)+'</div>':'')+'</div></div>';
  }
  document.getElementById('canvas').innerHTML=S.map(function(s,i){
    var k=s.kind||'point', h='';
    if(k==='cover'){
      h='<div class="eyebrow">'+esc(s.eyebrow||'')+'</div><h1>'+esc(s.title)+'</h1>'+
        (s.icons?'<div class="igrid">'+s.icons.map(function(ic){return '<div>'+iconHTML(ic)+'</div>'}).join('')+'</div>':'')+
        '<div class="swipe">Swipe →</div>';
    }else if(k==='tool'){
      h='<div class="eyebrow">'+esc(s.eyebrow||'')+'</div>'+(s.title?'<h2>'+esc(s.title)+'</h2>':'')+
        '<div class="tools'+((s.tools||[]).length===1?' one':'')+'">'+(s.tools||[]).map(tool).join('')+
        (s.source?'<div class="src"><div class="ic">'+iconHTML(s.source.icon||'fluent:Chart increasing')+'</div><div><small>'+esc(s.source.label||'My data source')+'</small><b>'+esc(s.source.name)+'</b>'+(s.source.note?'<span>'+esc(s.source.note)+'</span>':'')+'</div></div>':'')+'</div>';
    }else if(k==='cta'){
      h=(s.icon?'<div class="big">'+iconHTML(s.icon)+'</div>':'')+'<div class="eyebrow">'+esc(s.eyebrow||'')+'</div><h1>'+esc(s.title)+'</h1>'+(s.body?'<p class="b">'+esc(s.body)+'</p>':'');
    }else{
      h='<div class="eyebrow">'+esc(s.eyebrow||'')+'</div><h2>'+esc(s.title)+'</h2>'+(s.body?'<p class="b">'+esc(s.body)+'</p>':'')+(s.code?'<pre>'+esc(s.code)+'</pre>':'');
    }
    return '<section class="slide '+k+'">'+(k!=='cover'?'<div class="num">'+(i+1)+'/'+n+'</div>':'')+h+footer(true)+'</section>';
  }).join('');
  var imgs=[].slice.call(document.images);
  Promise.all(imgs.map(function(im){return im.complete?1:new Promise(function(r){im.onload=im.onerror=r})})).then(done);
})();
</script>
