<!-- Mapa del ecosistema por capas (referencia: «The AEO Landscape», data/refs/landscape_aeo_skoolation.webp).
Una fila por capa (número, nombre, para qué sirve) con los logos de esa capa. Muy guardable: «N empresas en M capas».
SPEC: {title, highlight?, subtitle?, top?: {label, sub?, items: [{name, logo}]},
       rows: [{label, sub?, items: [{name, logo}]}],   8–12 filas, 3–5 logos por fila
       accent?: "#2f55ff"} -->
<style>
#canvas{background:linear-gradient(180deg,#eef3ff 0%,#ffffff 30%);color:#111633;padding:44px 40px 30px}
#t{text-align:center;font:900 72px/1 var(--display);letter-spacing:-.035em;text-transform:uppercase}
#t em{font-style:normal;color:var(--acc)}
#s{text-align:center;font:600 24px var(--body);color:#3a4166;margin-top:10px}
.tbl{flex:1;display:flex;flex-direction:column;gap:7px;margin-top:22px;min-height:0}
.row{flex:1;display:grid;grid-template-columns:56px 250px 1fr;align-items:stretch;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 0 #dfe5f5,0 4px 14px #1e2a6612;min-height:0}
.row.top{background:var(--acc);color:#fff;flex:1.25}
.num{display:grid;place-items:center;font:800 24px var(--mono);color:var(--acc);background:#eef2ff}
.top .num{background:#ffffff22;color:#fff}
.lab{display:flex;flex-direction:column;justify-content:center;padding:4px 14px;border-right:1px solid #e8ecf7}
.lab b{font:800 21px/1.1 var(--display);letter-spacing:-.01em}
.lab small{font:500 14px/1.2 var(--body);color:#5c6488;margin-top:3px}
.top .lab small{color:#dfe6ff}.top .lab{border-color:#ffffff33}
.its{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-items:center;gap:6px;padding:0 10px}
.it{display:flex;align-items:center;gap:9px;font:700 19px/1.1 var(--body);min-width:0}
.it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .lg{flex:none;width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px #0000001f}
.it .lg img{width:26px;height:26px;object-fit:contain}
.top .it{color:#fff}
@keyframes up{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes slide{from{opacity:0;translate:-40px 0}to{opacity:1;translate:0 0}}
@keyframes pop{0%{opacity:0;scale:.3}70%{opacity:1;scale:1.15}100%{opacity:1;scale:1}}
</style>
<div id="canvas"><h1 id="t"></h1><p id="s"></p><div class="tbl" id="tb"></div><div id="f"></div></div>
<script>
(function(){
  var S=SPEC;document.getElementById('canvas').style.setProperty('--acc',S.accent||'#2f55ff');
  var t=esc(S.title||'');if(S.highlight)t=t.replace(esc(S.highlight),'<em>'+esc(S.highlight)+'</em>');
  document.getElementById('t').innerHTML=t;document.getElementById('s').textContent=S.subtitle||'';
  function row(r,num,top){return '<div class="row'+(top?' top':'')+'"><div class="num">'+num+'</div><div class="lab"><b>'+esc(r.label)+'</b>'+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div>'+
    '<div class="its">'+(r.items||[]).map(function(x){return '<div class="it"><span class="lg">'+iconHTML(x.logo||'')+'</span><span>'+esc(x.name)+'</span></div>'}).join('')+'</div></div>'}
  var mx=Math.max.apply(null,[(S.top||{items:[]}).items.length].concat((S.rows||[]).map(function(r){return (r.items||[]).length})));document.getElementById('canvas').style.setProperty('--cols',Math.max(3,mx));
  document.getElementById('tb').innerHTML=(S.top?row(S.top,'#',true):'')+(S.rows||[]).map(function(r,i){return row(r,String(i+1).padStart(2,'0'))}).join('');
  document.getElementById('f').outerHTML=footer(false);
  if(S.animate){
    var q=function(s){return [].slice.call(document.querySelectorAll(s))};
    function A(el,name,delay,dur){if(el)el.style.animation=name+' '+dur+'s cubic-bezier(.2,.8,.2,1) '+delay.toFixed(2)+'s both'}
    A(document.getElementById('t'),'up',.1,.6);A(document.getElementById('s'),'up',.3,.6);
    var t0=.6;q('.row').forEach(function(r,i){A(r,'slide',t0+i*.28,.5);[].slice.call(r.querySelectorAll('.lg')).forEach(function(l,k){A(l,'pop',t0+i*.28+.25+k*.06,.4)})});
    var end=t0+q('.row').length*.28+.6;A(document.querySelector('.footer'),'up',end,.5);window.ANIM_END=end+.8;
  }
  doneAfterImages();
})();
</script>
